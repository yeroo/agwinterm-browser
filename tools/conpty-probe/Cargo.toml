[package]
name = "conpty-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Measures what a ConPTY child actually receives on stdin for VT input sequences."

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
